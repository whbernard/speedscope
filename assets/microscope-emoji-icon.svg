<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#1E40AF" stroke="#1E3A8A" stroke-width="8"/>
  
  <!-- Microscope base (like emoji) -->
  <rect x="180" y="380" width="152" height="32" rx="16" fill="#F8FAFC"/>
  
  <!-- Microscope arm (vertical) -->
  <rect x="240" y="200" width="16" height="180" fill="#F8FAFC"/>
  
  <!-- Microscope head (horizontal tube) -->
  <rect x="200" y="190" width="120" height="20" rx="10" fill="#F8FAFC"/>
  
  <!-- Objective lens (front) -->
  <circle cx="200" cy="200" r="18" fill="#1E40AF"/>
  <circle cx="200" cy="200" r="12" fill="#3B82F6"/>
  <circle cx="200" cy="200" r="8" fill="#60A5FA"/>
  <circle cx="200" cy="200" r="4" fill="#93C5FD"/>
  
  <!-- Eyepiece (back) -->
  <circle cx="320" cy="200" r="15" fill="#F8FAFC"/>
  <circle cx="320" cy="200" r="10" fill="#1E40AF"/>
  <circle cx="320" cy="200" r="6" fill="#3B82F6"/>
  
  <!-- Stage platform -->
  <rect x="160" y="250" width="160" height="12" rx="6" fill="#F8FAFC"/>
  
  <!-- Stage clips (like emoji) -->
  <rect x="150" y="240" width="12" height="32" rx="6" fill="#F8FAFC"/>
  <rect x="350" y="240" width="12" height="32" rx="6" fill="#F8FAFC"/>
  
  <!-- Illuminator/light source -->
  <rect x="220" y="320" width="72" height="16" rx="8" fill="#F8FAFC"/>
  <rect x="225" y="325" width="62" height="6" rx="3" fill="#60A5FA"/>
  
  <!-- Light rays (like emoji) -->
  <path d="M 256 320 Q 256 300 256 280" stroke="#60A5FA" stroke-width="4" fill="none" opacity="0.8"/>
  <path d="M 240 320 Q 240 300 240 280" stroke="#60A5FA" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 272 320 Q 272 300 272 280" stroke="#60A5FA" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 224 320 Q 224 300 224 280" stroke="#60A5FA" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 288 320 Q 288 300 288 280" stroke="#60A5FA" stroke-width="2" fill="none" opacity="0.4"/>
  
  <!-- Fine focus knob (like emoji) -->
  <circle cx="160" y="200" r="12" fill="#F8FAFC"/>
  <circle cx="160" y="200" r="8" fill="#1E40AF"/>
  <circle cx="160" y="200" r="4" fill="#3B82F6"/>
  
  <!-- Coarse focus knob -->
  <circle cx="140" y="220" r="10" fill="#F8FAFC"/>
  <circle cx="140" y="220" r="6" fill="#1E40AF"/>
  <circle cx="140" y="220" r="3" fill="#3B82F6"/>
  
  <!-- Sample slide (like emoji) -->
  <rect x="180" y="240" width="120" height="6" rx="3" fill="#E2E8F0" stroke="#A0AEC0" stroke-width="1"/>
  <rect x="185" y="242" width="110" height="2" rx="1" fill="#F7FAFC"/>
</svg>
