  <!-- Light rays -->
  <path d="M 246 320 Q 246 300 246 280" stroke="#60A5FA" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M 240 320 Q 240 300 240 280" stroke="#60A5FA" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 252 320 Q 252 300 252 280" stroke="#60A5FA" stroke-width="2" fill="none" opacity="0.6"/>
