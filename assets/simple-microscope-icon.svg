<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#1E40AF" stroke="#1E3A8A" stroke-width="8"/>
  
  <!-- Microscope base -->
  <rect x="200" y="380" width="112" height="24" rx="12" fill="#F8FAFC"/>
  
  <!-- Microscope arm -->
  <rect x="240" y="200" width="12" height="180" fill="#F8FAFC"/>
  
  <!-- Microscope head -->
  <ellipse cx="246" cy="200" rx="50" ry="25" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="3"/>
  
  <!-- Objective lens -->
  <circle cx="246" cy="200" r="20" fill="#1E40AF"/>
  <circle cx="246" cy="200" r="15" fill="#3B82F6"/>
  <circle cx="246" cy="200" r="10" fill="#60A5FA"/>
  <circle cx="246" cy="200" r="5" fill="#93C5FD"/>
  
