[package]
name = "speedscope-llm"
version = "1.23.1"
description = "Speedscope with LLM - Performance profiler with AI-powered analysis"
authors = ["Speedscope Team"]
license = "MIT"
repository = "https://github.com/whbernard/speedscope"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.8.5", features = [] }
tauri-plugin-log = "2"
keyring = "2.3"
thiserror = "1.0"
